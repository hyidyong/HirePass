<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>HirePass</title>
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#080c14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
#root{height:100%}
select{appearance:none;-webkit-appearance:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:99px}
.screen{position:fixed;inset:0;width:100%;height:100%;transition:transform .48s cubic-bezier(.22,1,.36,1),opacity .48s ease;will-change:transform;overflow:hidden}
.s-active{transform:translateY(0);opacity:1;pointer-events:all;z-index:10}
.s-below{transform:translateY(100%);opacity:1;pointer-events:none;z-index:5}
.s-above{transform:translateY(-6%);opacity:0;pointer-events:none;z-index:5}
.scroll-inner{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.au{animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both}
.asi{animation:scaleIn .45s cubic-bezier(.22,1,.36,1) both}
.d1{animation-delay:.07s}.d2{animation-delay:.15s}.d3{animation-delay:.23s}
.d4{animation-delay:.31s}.d5{animation-delay:.40s}
.tip-warn{background:rgba(217,119,6,.1);border-left:3px solid #d97706;border-radius:8px;padding:10px 13px;font-size:.77rem;color:#fbbf24;line-height:1.65}
.tip-good{background:rgba(5,150,105,.1);border-left:3px solid #059669;border-radius:8px;padding:10px 13px;font-size:.77rem;color:#34d399;line-height:1.65}
.tip-blue{background:rgba(29,78,216,.1);border-left:3px solid #3b82f6;border-radius:8px;padding:10px 13px;font-size:.77rem;color:#60a5fa;line-height:1.65}
@media(max-width:600px){.grid-2{grid-template-columns:1fr!important}}
</style>
</head>
