/* ─ Government Support DB ──────────────────────────────────────────────── */
function getSupport(co, cand) {
  const programs = [];

  // 1. K-Work 중기부 고용추천 (D-2 유학생 or SW/AI 직무)
  if (["d2","d10"].includes(cand.visaStatus) || ["sw_dev","ai","rd"].includes(co.jobRole)) {
    programs.push({
      id:"kwork", icon:"🏛️", tag:"중소벤처기업부",
      title:"K-Work 고용추천서 발급",
      desc:"중기부 소관 24개 직종에 종사 예정인 외국인 유학생(D-2)·구직자(D-10)에게 E-7-1 고용추천서를 발급합니다. 이노비즈·벤처기업은 우선 추천 대상에 포함됩니다.",
      link:"https://k-work.or.kr",
      cond:["이노비즈·벤처·연구소 보유 기업 우대", "SW·AI·제조기술 등 24개 직종 해당 필요", "후보자 전공-직무 일치 요건 확인 필요"],
      color:"#1d4ed8", bg:"#eff6ff",
    });
  }

  // 2. KOITA 중소기업 연구인력 채용지원 (연구소 or R&D 직무)
  if (["lab","innobiz"].includes(co.companyType) || co.jobRole === "rd") {
    programs.push({
      id:"koita", icon:"🔬", tag:"한국산업기술진흥협회",
      title:"중소기업 연구인력 채용지원 사업",
      desc:"전문연구인력을 신규 고용하고 3개월 이상 유지 시 인당 연 1,080만 원을 지원합니다. 국내 대학에서 석사 이상 취득한 외국인도 신청 가능합니다.",
      link:"https://www.koita.or.kr",
      cond:["기업부설연구소 또는 이노비즈 인증 필요", "석사 이상 외국인 지원 가능 (국내 대학 취득 시)", "타 인건비 지원 사업과 중복 수혜 불가"],
      color:"#059669", bg:"#ecfdf5",
    });
  }

  // 3. KOTRA 외국인 유학생 채용박람회 (D-2 or 해외거주)
  if (["d2","overseas","d10"].includes(cand.visaStatus)) {
    programs.push({
      id:"kotra", icon:"🌐", tag:"KOTRA",
      title:"글로벌 탤런트 페어 (외국인유학생 채용관)",
      desc:"KOTRA가 주관하는 국내 최대 글로벌 인재 채용박람회로, 외국인 유학생·구직자와 국내 기업을 연결합니다. 기업 부스 참가 및 사전 매칭 면접이 가능합니다.",
      link:"https://jffds.kotra.biz",
      cond:["연 1~2회 개최 (서울 aT센터 등)", "참가 기업 사전 등록 필요", "D-2·D-10 후보자 연결에 효과적"],
      color:"#ea580c", bg:"#fff7ed",
    });
  }

  // 4. E-7 임금요건 특례 (비수도권 or 이노비즈/벤처)
  if (co.location !== "metro" || ["innobiz","venture","mainbiz"].includes(co.companyType)) {
    programs.push({
      id:"wage", icon:"💰", tag:"법무부",
      title:"E-7 임금요건 중소·벤처기업 특례",
      desc:"2026년 기준 E-7 전문인력 임금요건은 연 3,112만 원 이상이나, 중소·벤처·비수도권 중견기업은 전년도 GNI 70% 이상(약 2,350만 원)으로 완화 적용됩니다.",
      link:"https://visalovekorea.com/E-7",
      cond:["중소기업·벤처기업·비수도권 중견기업에 한정", "고용계약서에 월 급여 및 근로시간 명시 필수", "준전문·일반기능인력: 연 2,589만 원 이상"],
      color:"#7e22ce", bg:"#fdf4ff",
    });
  }

  // 5. 한국산업인력공단 고용행정 대행 (비자 경험 없는 기업)
  if (co.visaExp !== "yes") {
    programs.push({
      id:"hrdk", icon:"📋", tag:"한국산업인력공단",
      title:"외국인 고용허가제 행정 대행 서비스",
      desc:"비자 행정 경험이 없는 기업을 위해 고용허가서 발급·사증발급인정서·입국지원 등을 대행합니다. 업종별 대행기관(중소기업중앙회 등)을 통해 신청 가능합니다.",
      link:"https://www.hrdkorea.or.kr",
      cond:["E-9(비전문) 도입 기업 대상 공단 대행 가능", "E-7 전문인력은 법무사·노무사 병행 권장", "처음 채용하는 기업에 특히 유용"],
      color:"#0369a1", bg:"#f0f9ff",
    });
  }

  return programs.slice(0, 4); // max 4 cards
}

/* ─ Score Logic ─────────────────────────────────────────────────────────── */
function calcScore(co, ca) {
  // 1. Edu+Exp (20)
  let ed = 0;
  if (ca.education==="phd") ed=19;
  else if (ca.education==="master") ed=17;
  else if (ca.education==="bachelor") ed={none:7,lt1:9,gte1:12,gte2:15,gte5:18}[ca.experience]??7;
  else if (ca.education==="associate") ed={none:4,lt1:5,gte1:6,gte2:8,gte5:10}[ca.experience]??4;
  else ed=3;
  if (["simple_admin","simple_labor"].includes(co.jobRole)) ed=Math.min(ed,5);

  // TOPIK bonus (max +2)
  const topikBonus = {none:0,"1_2":0,"3_4":1,"5_6":2,"native":2}[ca.topik]??0;
  const eduExp = Math.min(ed + topikBonus, 20);

  // 2. Major/Job (20)
  const high={sw:["sw_dev","ai","rd"],ai:["ai","rd","sw_dev"],mech:["production","quality","rd"],bio:["rd","quality"],design:["export","mgmt"],biz:["mgmt","export","sales"],trade:["sales","export"]};
  let mj=["simple_admin","simple_labor"].includes(co.jobRole)?4:high[ca.major]?.includes(co.jobRole)?19:9;
  const majorJob=Math.min(mj,20);

  // 3. Visa (20)
  const vs={f5:19,f2:18,e7:17,d10:13,d2:11,overseas:9,e74:7,e9:6,unknown:4};
  const visa=Math.min(vs[ca.visaStatus]??4,20);

  // 4. Admin (15)
  const innov=["venture","innobiz","mainbiz","lab"].includes(co.companyType);
  let adm=6;
  if(innov&&co.visaExp==="yes") adm=14;
  else if(innov&&co.visaExp==="no") adm=9;
  else if(innov) adm=8;
  else if(co.companyType==="sme"&&co.visaExp==="yes") adm=9;
  else if(co.companyType==="sme") adm=5;
  if(co.location==="metro") adm=Math.min(adm+1,15);
  const admin=Math.min(adm,15);

  // 5. Comm (10)
  const cm={multi:10,en_ok:9,kr_en:7,kr:5,not_ready:2};
  const comm=Math.min(cm[co.language]??2,10);

  // 6. Security (15)
  const n=co.securityChecks.filter(Boolean).length;
  const security=[0,3,6,9,12,15][n];

  return { score:eduExp+majorJob+visa+admin+comm+security, bd:{eduExp,majorJob,visa,admin,comm,security} };
}

                <div key={i} style={{ display:"flex",gap:5,marginBottom:5,alignItems:"flex-start" }}>
                  <span style={{ color:acc,fontSize:11,flexShrink:0,marginTop:2 }}>›</span>
                  <span style={{ fontSize:"0.77rem",color:"#cbd5e1",lineHeight:1.55 }}>{s}</span>
                </div>
              ))}
            </div>
          ))}
          <div style={{ background:"rgba(255,255,255,.06)",borderRadius:9,padding:14 }}>
            <div className="sec-lbl" style={{ color:"#64748b",marginBottom:9 }}>🔐 기술보호 권고</div>
            <p style={{ fontSize:"0.77rem",color:"#94a3b8",lineHeight:1.7 }}>
              {secN>=4?"체계가 잘 갖춰져 있습니다. 정기 보안 점검과 서약 갱신을 유지하세요.":secN>=2?"NDA 체결·접근권한 분리·자료 반출 통제를 우선 조치하세요.":"기술보호 체계 전반 구축이 시급합니다. NDA, 접근권한, 반출 통제를 즉시 마련하세요."}
            </p>
          </div>
          <div style={{ background:"rgba(255,255,255,.06)",borderRadius:9,padding:14 }}>
            <div className="sec-lbl" style={{ color:"#64748b",marginBottom:9 }}>🏢 온보딩 권고</div>
            <p style={{ fontSize:"0.77rem",color:"#94a3b8",lineHeight:1.7 }}>
              {["kr","not_ready"].includes(company.language)?"언어 장벽 대비 업무 언어 정책 수립 및 온보딩 담당자 지정이 필요합니다.":"온보딩 담당자를 지정하고 입사 초기 3개월간 정기 체크인을 운영하세요."}
            </p>
          </div>
        </div>
        <div style={{ marginTop:12,background:"rgba(251,191,36,.09)",border:"1px solid rgba(251,191,36,.18)",borderRadius:8,padding:"10px 13px",fontSize:"0.75rem",color:"#fcd34d",lineHeight:1.7 }}>
          ⚠ 실제 채용 전 <strong>출입국·외국인관서, 법무사, 노무사</strong>를 통한 비자 적합성 확인이 필요합니다.
        </div>
      </div>

      <button className="btn-s" onClick={onBack} style={{ padding:"0 18px",fontSize:"0.85rem",width:"100%" }}>← 처음부터 다시</button>
    </div>
  );
}
